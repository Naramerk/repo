name: ci
on: [push, pull_request]
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.3 pydantic==2.14.1 pytest==9.1.1 ruff==0.17.2 rfc8785==0.1.4 pytest-asyncio==0.26.0 hypothesis==6.148.2 mypy==1.19.1 types-PyYAML==6.0.12.20250915
      - run: ruff check scripts tests
      - run: python scripts/gen_model_tables.py --check
      - run: mypy coscientist
      - run: pytest -q tests
