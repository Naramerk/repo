prompt: |
  Борщевик Сосновского (Heracleum sosnowskyi) — инвазивное растение, вызывающее тяжёлые фотохимические ожоги кожи; одновременно его вторичные метаболиты рассматривают как потенциальный источник биологически активных соединений (описаны противоопухолевая и антимикробная активности). Любое прикладное использование требует предварительной оценки полного токсикологического профиля.

  Составь in-silico токсикологический профиль метаболитов H. sosnowskyi: охарактеризуй химическое пространство известных метаболитов, кластеризуй их по структурному сходству, предскажи острый LD50 (мышь) для всех путей введения там, где нет экспериментальных данных, оцени домен применимости моделей. Для наиболее токсичного кластера предскажи гепатотоксичность, кардиотоксичность, DILI и канцерогенность; для трёх перспективных соединений этого кластера оцени стоимость синтеза.

  Итог — отчёт с тепловой картой токсичности (кластер × путь введения), отображением химического пространства / дендрограммой кластеризации и сравнительными таблицами по классам, путям введения и эндпоинтам.

  Для расчётов используй MCP heracleum-tox (server_id bfc62a287aaf7b5a, http://10.32.11.45:7336/mcp): dataset_overview_heracleum_tox, chemical_space_clustering, predict_ld50, applicability_domain, predict_general_toxicity, estimate_synthesis_cost. Не заменяй эти вызовы собственным кодом. Код допустим только чтобы собрать из их результатов тепловую карту, дендрограмму и сравнительные таблицы.

