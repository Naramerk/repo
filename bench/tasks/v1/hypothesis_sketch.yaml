title: Hypothesis sketch (easy)
prompt: |
  Propose one falsifiable hypothesis about whether retrieval-augmented
  generation reduces hallucination rate on multi-hop QA relative to a
  closed-book baseline. Include independent variable, dependent variable,
  and a success criterion a study could measure.
