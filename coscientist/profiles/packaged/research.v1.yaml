# Production research profile skeleton (DESIGN §7.1 / §7.5 / §8).
# Roles: tz_spec, planner, hypothesizer, researcher, critic, executor-route,
# reviewer, report.
# hypothesizer / researcher: wired optional need-stage roles (CLI
# --wired-roles ["hypothesizer","researcher"]; routes hypotheses/literature).
# The researcher runs the literature tool allowlist (papers-search +
# paper-analysis exact live sets; bench/lab/mcp/README.md) through the planned
# surface — never model-invented papers.
# report: post-finalize report lane (scientific report + ГОСТ ТЗ/НИР from the
# graph projection; CLI --wired-roles ["report"]).
# MCP servers: none packaged yet (medicine/microfluidics fixtures unavailable).
# Tools: exact allowlist in tool_catalog.json; runtime resolve/invoke needs #65+#157.
name: research
profile_version: 1
max_attempts: 3
roles:
  tz_spec:
    model: gpt-4.1
    tools: []
  planner:
    model: gpt-4.1
    tools: []
  hypothesizer:
    model: gpt-4.1
    tools: []
  researcher:
    model: gpt-4.1
    tools:
      - search_papers
      - download_papers_from_search
      - find_papers_in_db
  critic:
    model: gpt-4.1
    tools: []
  executor-route:
    model: gpt-4.1
    tools: []
  reviewer:
    model: gpt-4.1
    tools:
      - read_artifact
  report:
    model: gpt-4.1
    tools: []
routes:
  spec:
    role: tz_spec
    budget:
      max_llm_calls: 8
      max_tokens: 32000
      max_tool_calls: 0
  hypotheses:
    role: hypothesizer
    budget:
      max_llm_calls: 8
      max_tokens: 32000
      max_tool_calls: 0
  literature:
    role: researcher
    budget:
      max_llm_calls: 8
      max_tokens: 32000
      max_tool_calls: 8
  plan:
    role: planner
    budget:
      max_llm_calls: 16
      max_tokens: 64000
      max_tool_calls: 0
  critic:
    role: critic
    budget:
      max_llm_calls: 8
      max_tokens: 32000
      max_tool_calls: 0
  execute:
    role: executor-route
    budget:
      max_llm_calls: 40
      max_tokens: 128000
      max_tool_calls: 80
  review:
    role: reviewer
    budget:
      max_llm_calls: 8
      max_tokens: 32000
      max_tool_calls: 16
mcp_servers: []
catalog_extensions: []
alembic: disabled
integrations: []
plugins: []
