# Single source of truth for the research graph (RESEARCH_MODEL.md §2, §3, §7).
# Tables between <!-- gen:* --> markers are generated by scripts/gen_model_tables.py.
version: 0.2
nodes:
  - kind: study
    prefix: ST
    fields: "**request**, **goal** (statement, research_form, trl), constraints[] (subtype, content, limit), profile, catalog_version, parent_study_id, confirmations_needed (профиль, по умолч. 1)"
    created_by: ядро (до DAG); goal/constraints[] заполняет spec
    from_output: ResearchSpecOut.goal, .constraints[]
    text_ru: Корень графа; цель и ограничения — его поля
  - kind: constraint
    prefix: C
    fields: "**subtype** (resource/data/norm/ethics/domain/profile), **content**, limit"
    created_by: spec
    from_output: ResearchSpecOut.constraints[] с проверкой
    text_ru: Узел только если на него направлен measured_by; иначе — поле study.constraints[]
  - kind: question
    prefix: Q
    fields: "**formulation**, gap, scope"
    created_by: spec
    from_output: ResearchSpecOut.questions[] (≥1, иначе schema_invalid)
    text_ru: Исследовательский вопрос; без гипотез ответ на него получает вердикт
  - kind: criterion
    prefix: CR
    fields: "**metric**, **op**, **target**, tolerance, kind=code|review, frozen_at_seq"
    created_by: spec (study), plan (experiment)
    from_output: ResearchSpecOut.success_metrics[], TaskSpec.criteria
    text_ru: Измеримая планка; статус = NodeRequirement
  - kind: hypothesis
    prefix: H
    fields: "**statement**, **prediction**, rationale, rank, selected, approved_by (human|critic), delegated_by"
    created_by: задача HYP-n (опционально)
    from_output: HypothesesOut (+ правка в HITL-шлюзе hypotheses)
    text_ru: Проверяемое утверждение; вердикт вычисляется
  - kind: plan
    prefix: PL
    fields: "**revision**, **hypotheses** {needed, reason}, **literature** {needed, reason}, critic_decision, approved_by (human|critic), delegated_by, approved_seq"
    created_by: plan; перепланирование после HYP/LIT и правка человеком = новая ревизия
    from_output: PlanOut + CriticVerdict + HitlDecision
    text_ru: Ревизия плана (маршрута)
  - kind: experiment
    prefix: X
    fields: "**task_key** (HYP-n не узел; LIT-n/EXP-n), **title**, **goal**, **method** (computational/statistical/laboratory/literature_search/expert), query_plan (literature_search), **route**, tools_hint, dataset, baselines, required, costly, tool_resolution, **attempts[]** (n, outcome, close_reason, provenance, config_digest), limitations[]"
    created_by: plan (при accept)
    from_output: TaskSpec
    text_ru: Задача DAG с попытками внутри
  - kind: artifact
    prefix: A
    fields: "**artifact_id**, **role** (paper/data/code/figure/table/log/report), media_type, sha256; paper: **doi|url** (идентичность дедупликации), title, year, status (parsed/download_failed); data: **version**, **hash**"
    created_by: любая (слой инструментов)
    from_output: ToolOutput; LiteratureOut.papers (только найденные инструментом)
    text_ru: Файл или статья (бывший source)
  - kind: evidence
    prefix: E
    fields: "**kind** (literature/computational/experimental/expert), **statement**, **ref**: EvidenceRef (computational/experimental) | SourceQuote (literature), measured_on"
    created_by: experiment (LIT-n, EXP-n)
    from_output: LiteratureOut.quotes, AgentTaskOutput.claims[].evidence
    text_ru: Адресуемое наблюдение
  - kind: claim
    prefix: CL
    fields: "**stance** (supports/refutes/inconclusive), **target** (hypothesis|question), **checked_against** (criterion, frozen), reason"
    created_by: experiment, report
    from_output: AgentTaskOutput.claims[], LiteratureOut.claims[]
    text_ru: Утверждение со ссылкой на доказательство
  - kind: conclusion
    prefix: CN
    fields: "**synthesis**, how_established, validity_bounds, open_questions"
    created_by: report
    from_output: ReportProse
    text_ru: Ответ на вопрос
  - kind: report
    prefix: RP
    fields: "**artifact_id**, format, approved_by (human|critic), delegated_by"
    created_by: report
    from_output: рендер кода + HITL-шлюз report
    text_ru: Документ из графа
edges:
  - {name: asks, from: [study], to: [question], card: "1..n", by: spec}
  - {name: constrained_by, from: [study], to: [constraint], card: "0..n (только проверяемые)", by: spec}
  - {name: measured_by, from: [study, constraint, experiment], to: [criterion], card: "study ≥1; constraint ≥1; required experiment ≥1", by: spec/plan}
  - {name: addresses, from: [hypothesis, experiment], to: [question], card: "hypothesis 1..n; ref обязателен, умолчания нет", by: HYP-n/plan}
  - {name: plans, from: [plan], to: [experiment], card: "1..n; experiment ровно 1 plan", by: plan}
  - {name: tests, from: [experiment], to: [hypothesis], card: "0..n; у experiment ≥1 из tests/addresses", by: plan}
  - {name: depends_on, from: [experiment], to: [experiment], card: "0..n, ацикл.", by: plan}
  - {name: uses_input, from: [experiment], to: [artifact], card: "0..n, provenance real/partial/simulated", by: ядро (P2)}
  - {name: produced, from: [experiment], to: [artifact], card: "artifact ровно 1 producer; attempt_n на ребре", by: слой инструментов}
  - {name: derived_from, from: [evidence, plan], to: [artifact, plan], card: "evidence → artifact ровно 1; plan → plan 0..1 (ревизия/правка HITL)", by: код}
  - {name: about, from: [claim], to: [hypothesis, question], card: "ровно 1", by: код}
  - {name: cites, from: [claim], to: [evidence], card: "≥1", by: код}
  - {name: answers, from: [conclusion], to: [question], card: "1..n; каждый question ≥1", by: report}
  - {name: based_on, from: [conclusion], to: [claim, experiment], card: "≥1; experiment может быть FAILED/inconclusive", by: report}
  - {name: renders, from: [report], to: [conclusion], card: "1..n", by: report}
  - {name: supersedes, from: [hypothesis, criterion], to: [hypothesis, criterion], card: "0..1, тот же kind", by: ревизия}
rules:
  - {rule_id: "R02:profile_applicability", nodes: "study, NodeRequirement", check: "Code: каждый NOT_APPLICABLE имеет решение профиля (версия + rationale); отсутствие ресурса ≠ N/A; plan.hypotheses/literature.needed=false — с reason"}
  - {rule_id: "R04:process_instance_binding", nodes: "experiment.attempts[]", check: "Code: попытка привязана к task_key, n, experiment и роли агента; вызов агента без попытки — не экземпляр"}
  - {rule_id: "R05:iteration_reactivation", nodes: "experiment, plan", check: "Code: повтор = новая attempt или ревизия (derived_from/supersedes); прежние не перезаписываются; task_key уникален"}
  - {rule_id: "R06:checkpoint_contract", nodes: "experiment, plan", check: "Code: у задачи есть вход (depends_on DONE), завершение (criterion), доказательства (evidence), возврат (P3/HITL-шлюз)"}
  - {rule_id: "R11:evidence_locator", nodes: "evidence", check: "Code: computational/experimental → artifact_id + json_pointer + digest; literature → SourceQuote + quote_in_source"}
  - {rule_id: "R11:json_pointer_evidence_locator", nodes: "evidence(computational)", check: "Code: json_pointer резолвится в зарегистрированном JSON-артефакте, digest совпадает"}
  - {rule_id: "R14:configuration_snapshot", nodes: "experiment.attempts[]", check: "Code: attempt.config_digest = sha256(JCS(resolved config)) записан до запуска"}
  - {rule_id: "R16:verification_validation_split", nodes: "criterion, claim", check: "Code: verification (CodeCheck → criterion) и validation (вердикт по claim) — разные статусы; SUCCESS ≠ supported"}
  - {rule_id: "R17:predeclared_check", nodes: "criterion, claim", check: "Code: criterion.frozen_at_seq < seq первой evidence; claim.checked_against — замороженный criterion; правка = supersedes"}
  - {rule_id: "R17:registered_schema_binding", nodes: "artifact(data)", check: "Code: schema_valid по schema_ref, закреплённой в OutputSpec до запуска"}
  - {rule_id: "R18:scientific_claim_trace", nodes: "claim, hypothesis, question, conclusion", check: "Code graph_shape: claim → (hypothesis → question | question); claim → evidence → artifact → experiment(method) → attempt; checked_against"}
  - {rule_id: "R23:unassessed_distinct", nodes: "criterion(review)", check: "UNASSESSED, FAILED, NOT_APPLICABLE хранятся раздельно; не становятся 0 или N/A"}
  - {rule_id: "R24:critical_blocker", nodes: "все", check: "открытое критическое несоответствие блокирует только затронутые использования; без усреднения (DESIGN §5.4)"}
  - {rule_id: "R28:corrective_action_closure", nodes: "NodeRequirement, experiment", check: "Code: FAILED закрывается только новой попыткой/ревизией с evidence эффективности и решением; прежняя оценка хранится"}
  - {rule_id: "R29:report_completeness", nodes: "report, conclusion", check: "Code: разделы из графа: покрытие, неопределённость, находки, limitations[], real/stub/human, решения HITL (кто, делегировано, timeout→agent)"}
  - {rule_id: "R30:information_access_integrity", nodes: "artifact", check: "Code: блоб cas/<sha256> читается; paper без файла → download_failed, не пропадает"}
  - {rule_id: "ENG:registration_integrity", nodes: "artifact, evidence", check: "Code: re-read digest совпадает; иначе зависимые использования блокируются"}
