# Single source of truth for the research graph (RESEARCH_MODEL.md §2, §3, §7).
# Tables between <!-- gen:* --> markers are generated by scripts/gen_model_tables.py.
# field.type: str | int | bool | float | datetime | digest | enum(a|b) | ref(kind|kind) | list(T) | obj(Name)
# edge.card: out = рёбер на один from-узел, in = рёбер на один to-узел (min..max, n = без предела); out_by_src уточняет out по виду from
# edge.attrs: optional list of {name, type, required, default?} — attributes on the edge (same type grammar as fields)
# field.computed: true — поле вычисляет код; во входной схеме роли его нет (extra=forbid)
version: "0.9"
# Provenance on attempts / input bindings (DESIGN §3.4): real | partial | stub
provenance: [real, partial, stub]
code_check_kinds: [artifact_exists, schema_valid, json_pointer, source_link, metric_threshold, value_matches,
  graph_shape, quote_in_source, min_sources, question_coverage, recency,
  exec_runs, tests_pass, metric_on_holdout, reproducible_rerun, rubric]
nodes:
  - kind: study
    prefix: ST
    created_by: ядро (до DAG); goal/constraints заполняет spec
    from_output: ResearchSpecOut.goal, .constraints[]
    text_ru: Корень графа; цель и ограничения — его поля
    fields:
      - {name: request, type: str, required: true}
      - {name: goal, type: obj(Goal), required: true, note: "statement, research_form, trl"}
      - {name: constraints, type: list(obj(Constraint)), required: false}
      - {name: profile, type: str, required: true}
      - {name: catalog_version, type: str, required: true}
      - {name: confirmations_needed, type: int, required: true, note: "RC3t: required"}
      - {name: max_expansions, type: int, required: true, note: "was max_replans; RC3t required"}
      - {name: max_attempts, type: int, required: true, note: "RC17a / D17: profile.max_attempts → Study"}
      - {name: parent_study_id, type: str, required: false}
  - kind: constraint
    prefix: C
    created_by: spec
    from_output: ResearchSpecOut.constraints[] с проверкой
    text_ru: Узел только если на него направлен measured_by; иначе — поле study.constraints
    fields:
      - {name: subtype, type: enum(resource|data|norm|ethics|domain|profile), required: true}
      - {name: content, type: str, required: true}
      - {name: limit, type: str, required: false}
  - kind: question
    prefix: Q
    created_by: spec
    from_output: ResearchSpecOut.questions[] (≥1, иначе schema_invalid); Plan.questions[] (core, PR 2)
    text_ru: Исследовательский вопрос; без гипотез вердикт получает ответ на него
    fields:
      - {name: formulation, type: str, required: true}
      - {name: gap, type: str, required: false}
      - {name: scope, type: str, required: false}
      - {name: final_type, type: enum(verdict|artifact|both), required: false, default: verdict, note: "M1 PR13; artifact ⇔ рубрика MET; verdict ⇔ claim; both — оба"}
      - {name: origin, type: enum(explicit|implicit|emergent|plan), required: false, note: "PR16 decompose origin (also on decomposes edge)"}
      - {name: parent_id, type: str, required: false, note: "PR16 subquestion parent question id"}
  - kind: criterion
    prefix: CR
    created_by: spec (study), plan (experiment)
    from_output: ResearchSpecOut.success_metrics[], TaskSpec.criteria
    text_ru: Измеримая планка; статус = NodeRequirement (met/not_met/unassessed)
    # Discriminator check: code|review require metric/op/target; rubric splits on affects_stance
    # (DESIGN_M1 §6.2 — qualitative rubric never feeds stance without metric).
    discriminator: check
    fields:
      - {name: check, type: enum(code|review|rubric), required: true, note: "rubric = qualitative OutputSpec.rubric (PR13); never feeds claim stance alone"}
      - {name: tolerance, type: float, required: false}
      - {name: frozen_at_seq, type: int, required: false}
      - {name: frozen, type: bool, required: false, note: "accept-time freeze marker before frozen_at_seq projection"}
      - {name: template_id, type: str, required: false, note: "catalog template id at freeze"}
      - {name: sesoi, type: float, required: false, note: "PR8b smallest effect size of interest"}
      - {name: min_power, type: float, required: false, note: "PR8b e.g. 0.8; frozen with criterion"}
      - {name: alpha, type: float, required: false, default: 0.05, note: "PR8b"}
      - {name: uses_sesoi, type: bool, required: false}
      - {name: predicted_direction, type: str, required: false}
      - {name: predicts_null, type: bool, required: false}
    variants:
      - match: {check: code}
        fields:
          - {name: metric, type: str, required: true}
          - {name: op, type: "enum(<|<=|==|>=|>|in)", required: true}
          - {name: target, type: str, required: true}
      - match: {check: review}
        fields:
          - {name: metric, type: str, required: true}
          - {name: op, type: "enum(<|<=|==|>=|>|in)", required: true}
          - {name: target, type: str, required: true}
      - match: {check: rubric, affects_stance: false}
        note: "PR13 qualitative — identity is rubric_digest; stance fields optional"
        fields:
          - {name: affects_stance, type: bool, required: true}
          - {name: rubric_digest, type: digest, required: true, note: "M1 PR13 sha256(JCS(items+aggregate))"}
          - {name: metric, type: str, required: false}
          - {name: op, type: "enum(<|<=|==|>=|>|in)", required: false}
          - {name: target, type: str, required: false}
      - match: {check: rubric, affects_stance: true}
        note: "rubric that feeds stance must carry metric/op/target (DESIGN_M1 §6.2)"
        fields:
          - {name: affects_stance, type: bool, required: true}
          - {name: rubric_digest, type: digest, required: false}
          - {name: metric, type: str, required: true}
          - {name: op, type: "enum(<|<=|==|>=|>|in)", required: true}
          - {name: target, type: str, required: true}
  - kind: hypothesis
    prefix: H
    created_by: задача HYP-n (опционально)
    from_output: HypothesesOut (+ правка в HITL-шлюзе hypotheses)
    text_ru: Проверяемое утверждение; вердикт вычисляется (PR8b projection + VerdictSnapshotsRecorded)
    fields:
      - {name: statement, type: str, required: true}
      - {name: prediction, type: str, required: true}
      - {name: rationale, type: str, required: false}
      - {name: rank, type: int, required: false}
      - {name: selected, type: bool, required: true}
      - {name: source_task, type: str, required: false, note: "foreach of_task filter (PR10); producing experiment task_key"}
      - {name: approved_by, type: enum(human|critic), required: false}
      - {name: delegated_by, type: enum(human|timeout), required: false}
      - {name: verdict, type: enum(supported|survived|refuted|inconclusive|untested), required: false, computed: true, note: "PR8b projection; also persisted via VerdictSnapshotsRecorded"}
  - kind: plan
    prefix: PL
    created_by: задача PLAN-0 и перепланирования PLAN-1..n (n ≤ max_expansions)
    from_output: PlanOut + CriticVerdict + HitlDecision
    text_ru: Ревизия плана (маршрута); правка = новая ревизия + supersedes
    fields:
      - {name: revision, type: int, required: true}
      - {name: hypotheses, type: obj(Need), required: true, note: "{needed, reason}"}
      - {name: literature, type: obj(Need), required: true, note: "{needed, reason}"}
      - {name: critic_decision, type: enum(accept|revise|reject), required: false}
      - {name: approved_by, type: enum(human|critic), required: false, note: "HITL plan gate; human|critic"}
      - {name: delegated_by, type: enum(human|timeout), required: false, note: "«реши сам»/timeout; budget gate does NOT set this on plan"}
  - kind: experiment
    prefix: X
    created_by: PLAN-n (при accept)
    from_output: TaskSpec
    text_ru: Задача DAG (LIT-n/EXP-n) с попытками внутри
    fields:
      - {name: task_key, type: str, required: true, note: "LIT-n | EXP-n"}
      - {name: title, type: str, required: true}
      - {name: goal, type: str, required: true}
      - {name: method, type: enum(computational|statistical|laboratory|literature_search|expert|simulation), required: false, note: "optional on TaskSpec/plan stubs; simulation = scientific model run (not stub); input provenance still caps"}
      - {name: query_plan, type: list(str), required: false, note: "для literature_search"}
      - {name: route, type: str, required: true}
      - {name: required, type: bool, required: true}
      - {name: costly, type: bool, required: false}
      - {name: baselines, type: list(str), required: false}
      - {name: tool_resolution, type: enum(tool_found|tool_built|coder|tool_missing), required: false}
      - {name: addresses, type: list(str), required: false, note: "question id[]; by plan (TaskSpec.addresses)"}
      - {name: budget_share, type: float, required: false, note: "M1 PR12; None = equal remainder; Σ ≤ 1"}
      - {name: deadline_share, type: float, required: false, note: "M1 PR12; critical-path Σ ≤ 1"}
      - {name: attempts, type: list(obj(Attempt)), required: true, note: "n, outcome, close_reason, provenance=real|partial|stub, config_digest"}
      - {name: limitations, type: list(obj(Limitation)), required: false}
  - kind: artifact
    prefix: A
    created_by: любая (слой инструментов)
    from_output: ToolOutput; LiteratureOut.papers (только найденные инструментом)
    text_ru: Файл или статья (бывший source); paper дедуплицируется по DOI/URL
    fields:
      - {name: artifact_id, type: str, required: true}
      - {name: role, type: enum(paper|data|code|figure|table|log|report), required: true}
      - {name: kind, type: enum(experiment_design|contradiction_map), required: false, note: "M1 PR15; stamps core from explicit OutputSpec.kind (PlanValidator)"}
      - {name: media_type, type: str, required: false}
      - {name: sha256, type: digest, required: false}
      - {name: doi_or_url, type: str, required: false, note: "обяз. для paper; идентичность"}
      - {name: title, type: str, required: false}
      - {name: year, type: int, required: false}
      - {name: status, type: enum(parsed|download_failed), required: false, note: paper}
      - {name: version, type: str, required: false, note: "обяз. для data"}
      - {name: hash, type: digest, required: false, note: "обяз. для data"}
  - kind: evidence
    prefix: E
    created_by: experiment (LIT-n, EXP-n)
    from_output: LiteratureOut.quotes, AgentTaskOutput.evidence
    text_ru: Адресуемое наблюдение
    fields:
      - {name: kind, type: enum(literature|computational|experimental|expert|derivation), required: true, note: "M1 PR15 derivation = first principles"}
      - {name: statement, type: str, required: true}
      - {name: ref, type: obj(EvidenceRef|SourceQuote), required: true}
      - {name: measured_on, type: str, required: false}
      - {name: artifact_uri, type: str, required: false, note: "C1 evidence-link: CAS uri из ArtifactRegistered (локатор, не контент)"}
  - kind: claim
    prefix: CL
    created_by: experiment (LIT-n, EXP-n)
    from_output: AgentTaskOutput.claims[], LiteratureOut.claims[] (target + cites + checked_against; stance вычисляет код)
    text_ru: Утверждение со ссылкой на доказательство и критерий
    fields:
      - {name: target, type: ref(hypothesis|question), required: true}
      - {name: checked_against, type: ref(criterion), required: true}
      - {name: stance, type: enum(supports|refutes|inconclusive), required: true, computed: true, note: "вычисляет код: met→supports, not_met→refutes, unassessed→inconclusive; во входе роли запрещено"}
      - {name: reason, type: str, required: false}
      - {name: validity_ok, type: bool, required: false, computed: true, note: "PR8/PR8b; false → invalid"}
      - {name: claim_outcome, type: enum(consistent|inconsistent|indeterminate), required: false, computed: true, note: "PR8b; null when invalid"}
      - {name: severe, type: bool, required: false, computed: true, note: "PR8b Mayo severe gate"}
      - {name: independence_key, type: str, required: false, computed: true, note: "PR8b sha256(experiment_id); merge by root-data overlap / shared templates"}
      - {name: data_digests, type: list(str), required: false, computed: true, note: "PR8b root data content digests (artifact meta; transitive walk)"}
      - {name: criterion_template_ids, type: list(str), required: false, computed: true, note: "PR8b structural independence share-any (no goal/title/plan_id)"}
      - {name: p_value, type: float, required: false}
      - {name: power, type: float, required: false}
      - {name: sesoi, type: float, required: false, note: "from catalog template uses_sesoi"}
      - {name: uses_sesoi, type: bool, required: false, computed: true}
      - {name: used_sesoi, type: bool, required: false, computed: true}
      # Core-owned counting / provenance attrs (Executor.claim_nodes_from_attempt).
      - {name: provenance, type: enum(real|partial|stub), required: false}
      - {name: attempt_id, type: str, required: false}
      - {name: attempt_outcome, type: str, required: false}
      - {name: criterion_status, type: enum(met|not_met|unassessed), required: false}
      - {name: evidence_kind, type: str, required: false}
      - {name: frozen, type: bool, required: false}
      - {name: lit_own_criterion, type: bool, required: false}
      - {name: accepted, type: bool, required: false}
      - {name: artifact_id, type: str, required: false}
      - {name: check_role, type: enum(prediction|validity|unknown), required: false}
      - {name: exclusion_reason, type: str, required: false}
      - {name: outcome, type: enum(consistent|inconsistent|indeterminate), required: false}
      - {name: experiment_id, type: str, required: false}
      - {name: refute_capable, type: bool, required: false}
      - {name: predicts_null, type: bool, required: false}
      - {name: predicted_direction, type: enum(positive|negative|two_sided), required: false}
      - {name: study_id, type: str, required: false}
      - {name: effect, type: obj(Effect), required: false}
      - {name: alpha, type: float, required: false}
      - {name: independence_notes, type: list(str), required: false}
      - {name: refute_unresolved, type: bool, required: false}
      - {name: timeout_kind, type: str, required: false}
      - {name: derivation_executable, type: bool, required: false}
      - {name: premise_idx, type: int, required: false}
      - {name: confirming_evidence_ids, type: list(str), required: false}
      - {name: threshold_source_evidence_ids, type: list(str), required: false}
  - kind: conclusion
    prefix: CN
    created_by: report
    from_output: ReportProse
    text_ru: Ответ на вопрос
    fields:
      - {name: synthesis, type: str, required: true}
      - {name: how_established, type: str, required: false}
      - {name: validity_bounds, type: str, required: true}
      - {name: open_questions, type: list(str), required: false}
  - kind: report
    prefix: RP
    created_by: report
    from_output: рендер кода + HITL-шлюз report
    text_ru: Документ из графа
    fields:
      - {name: artifact_id, type: str, required: true}
      - {name: format, type: str, required: true}
      - {name: approved_by, type: enum(human|critic), required: false, note: "HITL: human|critic who approved"}
      - {name: delegated_by, type: enum(human|timeout), required: false, note: "HITL «реши сам»/timeout → critic; else absent"}
  - kind: hitl
    prefix: HITL
    created_by: HITL-шлюз (HitlDecided / delegate)
    from_output: HitlDecided
    text_ru: Узел решения HITL; budget-шлюз пишет approved_by/delegated_by только сюда (не на plan)
    fields:
      - {name: approved_by, type: enum(human|critic), required: false, note: "кто утвердил: human или critic после делегирования"}
      - {name: delegated_by, type: enum(human|timeout), required: false, note: "human=«реши сам»; timeout=on_timeout=delegate; иначе нет"}
      - {name: kind_gate, type: str, required: false, note: "исходный HitlOpened.kind (plan|budget|…)"}
  - kind: tool_call
    prefix: TC
    created_by: graph G17 fold from TG-Call journal
    from_output: ToolCalled
    text_ru: Один вызов инструмента (invoke_tool) по call_id; attrs 1:1 с ToolCalledPayload (ref flattened)
    fields:
      - {name: call_id, type: str, required: true}
      - {name: tool, type: str, required: true}
      - {name: args_digest, type: digest, required: true}
      - {name: started_at, type: datetime, required: true}
      - {name: ended_at, type: datetime, required: true}
      - {name: outcome, type: enum(ok|error), required: true}
      - {name: duration_ms, type: int, required: true}
      - {name: error_kind, type: str, required: false, note: "from ToolCalled when outcome=error; absent on ok"}
  - kind: mcp_exchange
    prefix: MCP
    created_by: graph G18 fold from MCP-J1 journal
    from_output: McpRequestRecorded / McpResponseRecorded
    text_ru: Один MCP tools/call обмен (request ± response) по call_id; attrs 1:1 с MCP-J1 payload
    fields:
      - {name: call_id, type: str, required: true}
      - {name: server_name, type: str, required: true}
      - {name: tool, type: str, required: true}
      - {name: attempt_id, type: str, required: true}
      - {name: args_digest, type: digest, required: true, note: "from McpRequestRecorded; response fold keeps prior"}
      - {name: content_digest, type: digest, required: false, note: "from McpResponseRecorded only"}
      - {name: is_error, type: bool, required: false, note: "from McpResponseRecorded only; absent on request-only"}
edges:
  - {name: asks, pairs: [[study, question]], card: {out: "1..n", in: "1..1"}, by: spec, attrs: []}
  - {name: constrained_by, pairs: [[study, constraint]], card: {out: "0..n", in: "1..1"}, by: spec, attrs: []}
  - {name: measured_by, pairs: [[study, criterion], [constraint, criterion], [experiment, criterion]], card: {out: "1..n", in: "1..1", out_by_src: {experiment: "0..n"}}, by: spec/plan, note: "experiment: ≥1 если required", attrs: []}
  - {name: addresses, pairs: [[hypothesis, question], [experiment, question]], card: {out: "0..n", in: "0..n", out_by_src: {hypothesis: "1..n"}}, by: "HYP-n/plan (TaskSpec.addresses)", note: "hypothesis ≥1; ref обязателен, умолчания нет", attrs: []}
  - {name: plans, pairs: [[plan, experiment]], card: {out: "1..n", in: "1..1"}, by: PLAN-n, attrs: []}
  - name: tests
    pairs: [[experiment, hypothesis]]
    card: {out: "0..n", in: "0..n"}
    by: plan
    attrs:
      - {name: intent, type: enum(confirm|refute), required: false, default: confirm}
    note: "у experiment ≥1 из tests/addresses; refute+met → survived"
  - {name: depends_on, pairs: [[experiment, experiment]], card: {out: "0..n", in: "0..n"}, by: plan, note: ацикл., attrs: []}
  - {name: uses_input, pairs: [[experiment, artifact]], card: {out: "0..n", in: "0..n"}, by: ядро (P2), note: "provenance на ребре", attrs: []}
  - {name: uses_claim, pairs: [[experiment, claim]], card: {out: "0..n", in: "0..n"}, by: "ядро (P2, InputSpec.kind=claim)", note: "M1 PR7; научный вход claim", attrs: []}
  - {name: contradicts, pairs: [[claim, claim]], card: {out: "0..n", in: "0..n"}, by: "ядро (противоположный stance к одной цели)", note: "M1 PR15 §6.5; одна запись на неупорядоченную пару (min,max); повтор → Idempotent", attrs: []}
  - {name: produced, pairs: [[experiment, artifact]], card: {out: "0..n", in: "1..1"}, by: слой инструментов, note: "attempt_n на ребре; повторно найденная paper — то же ребро", attrs: []}
  - {name: derived_from, pairs: [[evidence, artifact]], card: {out: "1..1", in: "0..n"}, by: код по EvidenceRef/SourceQuote, attrs: []}
  - {name: relates_to, pairs: [[evidence, question]], card: {out: "0..n", in: "0..n"}, by: "код (C1 evidence-link: наблюдение попытки → вопрос из TaskSpec.addresses)", note: "навигационная связь «наблюдение относится к вопросу», не вердикт (stance живёт на claim; R/M §9)", attrs: []}
  - {name: about, pairs: [[claim, hypothesis], [claim, question]], card: {out: "1..1", in: "0..n"}, by: код, attrs: []}
  - {name: cites, pairs: [[claim, evidence]], card: {out: "1..n", in: "0..n"}, by: код, attrs: []}
  - {name: answers, pairs: [[conclusion, question], [conclusion, study]], card: {out: "0..n", in: "0..n"}, by: finalize/report, note: "после финала: question in 1..1; study in 0..1; код enforce", attrs: []}
  - {name: based_on, pairs: [[conclusion, claim], [conclusion, experiment]], card: {out: "0..n", in: "0..n"}, by: report, note: "≥1 based_on если disposition ∈ {answered,refuted,survived} — код; not_attempted → пусто", attrs: []}
  - {name: renders, pairs: [[report, conclusion]], card: {out: "1..n", in: "0..1"}, by: report, attrs: []}
  - {name: supersedes, pairs: [[plan, plan], [hypothesis, hypothesis], [criterion, criterion], [question, question]], card: {out: "0..1", in: "0..1"}, by: "ревизия (PLAN-n, PlanExpanded, HITL-правка); question→question = C10/H-d", attrs: []}
  - {name: decomposes, pairs: [[question, question]], card: {out: "0..1", in: "0..n"}, by: "PLAN/PlanExpanded subquestions; origin=explicit|implicit|emergent; ацикл. (DESIGN_M1 §10)", attrs: [{name: origin, type: "enum(explicit|implicit|emergent|plan)", required: false}]}
volume_b:
  - {num: 1, id: problem, nodes: [study, question, hypothesis, experiment], check_kinds: [graph_shape], check: "≥1 question; у каждого непустой gap и ≥1 входящее addresses; Review: проблема сформулирована"}
  - {num: 2, id: goals, nodes: [study, criterion], check_kinds: [graph_shape], check: "study.goal непуст; study −measured_by→ ≥1 criterion с metric/op/target"}
  - {num: 3, id: planning, nodes: [plan, experiment, question], check_kinds: [graph_shape, rubric], check: "DAG ацикличен; у required experiment ≥1 criterion и ≥1 из tests/addresses; каждый question покрыт ≥1 LIT/EXP (PlanValidator); final_type=artifact ⇒ OutputSpec.rubric; final_type=verdict ⇒ ≥1 criterion; plan.hypotheses/literature с reason"}
  - {num: 4, id: resources, nodes: [constraint, experiment], check_kinds: [graph_shape], check: "tool_resolution ≠ tool_missing у required; бюджет не превышен"}
  - {num: 5, id: knowledge, nodes: [experiment, artifact, evidence], check_kinds: [min_sources, question_coverage, recency, quote_in_source], check: "если plan.literature.needed: §5.1 на LIT-n"}
  - {num: 6, id: data, nodes: [artifact, experiment], check_kinds: [schema_valid], check: "входы schema_valid; data имеет version и hash; provenance=real у required"}
  - {num: 7, id: config, nodes: [experiment], check_kinds: [graph_shape], check: "attempt.config_digest = sha256(JCS(resolved config)) записан (R14)"}
  - {num: 8, id: model, nodes: [experiment, artifact], check_kinds: [graph_shape], check: "method ∈ profile.methods; computational ⇒ produced artifact(code) или tool_found; Review: метод соответствует вопросу"}
  - {num: 9, id: execution, nodes: [experiment], check_kinds: [graph_shape], check: "≥1 попытка с outcome; нет открытых попыток у DONE задачи"}
  - {num: 10, id: validation, nodes: [criterion, claim], check_kinds: [metric_threshold, value_matches], check: "по EvidenceRef → статус criterion; stance claim из него"}
  - {num: 11, id: comparison, nodes: [experiment, evidence, claim], check_kinds: [json_pointer, metric_threshold], check: "для каждого baseline valid evidence с тем же metric и claim с checked_against на criterion сравнения; Review"}
  - {num: 12, id: application, nodes: [conclusion, experiment], check_kinds: [graph_shape], check: "validity_bounds непуст; каждая limitation based_on-экспериментов упомянута; Review"}
  - {num: 13, id: trace, nodes: [evidence, artifact], check_kinds: [source_link, json_pointer], check: "evidence ровно 1 derived_from, digest совпадает; artifact ровно 1 produced"}
  - {num: 14, id: report, nodes: [report, conclusion, question], check_kinds: [graph_shape], check: "conclusion −answers→ все question; разделы real/stub/human; решения HITL"}
rules:
- rule_id: R02:profile_applicability
  nodes:
  - study
  - NodeRequirement
  check: 'Code: каждый NOT_APPLICABLE имеет решение профиля (версия + rationale); отсутствие ресурса ≠ N/A; plan.hypotheses/literature.needed=false — с reason'
- rule_id: R04:process_instance_binding
  nodes:
  - experiment.attempts[]
  check: 'Code: попытка привязана к task_key, n, experiment и роли агента; вызов агента без попытки — не экземпляр'
- rule_id: R05:iteration_reactivation
  nodes:
  - experiment
  - plan
  check: 'Code: повтор = новая attempt или ревизия + supersedes (plan — новая задача PLAN-n); прежние не перезаписываются; task_key уникален'
- rule_id: R06:checkpoint_contract
  nodes:
  - experiment
  - plan
  check: 'Code: у задачи есть вход (depends_on DONE), завершение (criterion), доказательства (evidence), возврат (P3/HITL-шлюз)'
- rule_id: R11:evidence_locator
  nodes:
  - evidence
  check: 'Code: computational/experimental → artifact_id + json_pointer + digest; literature → SourceQuote + quote_in_source'
- rule_id: R11:json_pointer_evidence_locator
  nodes:
  - evidence(computational)
  check: 'Code: json_pointer резолвится в зарегистрированном JSON-артефакте, digest совпадает'
- rule_id: R14:configuration_snapshot
  nodes:
  - experiment.attempts[]
  check: 'Code: attempt.config_digest = sha256(JCS(resolved config)) записан до запуска'
- rule_id: R16:verification_validation_split
  nodes:
  - criterion
  - claim
  check: 'Code: verification (CodeCheck → criterion) и validation (вердикт по claim) — разные статусы; SUCCESS ≠ supported'
- rule_id: R17:predeclared_check
  nodes:
  - criterion
  - claim
  check: 'Code: criterion.frozen_at_seq < seq первой evidence; claim.checked_against — замороженный criterion; stance вычислен из его статуса; правка = supersedes'
- rule_id: R17:registered_schema_binding
  nodes:
  - artifact(data)
  check: 'Code: schema_valid по schema_ref, закреплённой в OutputSpec до запуска'
- rule_id: R18:scientific_claim_trace
  nodes:
  - claim
  - hypothesis
  - question
  - conclusion
  check: 'Code graph_shape: claim → (hypothesis → question | question); claim → evidence → artifact → experiment(method) → attempt; checked_against'
- rule_id: R23:unassessed_distinct
  nodes:
  - criterion(review)
  check: UNASSESSED, FAILED, NOT_APPLICABLE хранятся раздельно; не становятся 0 или N/A
- rule_id: R24:critical_blocker
  nodes:
  - все
  check: открытое критическое несоответствие блокирует только затронутые использования; без усреднения (DESIGN §5.4)
- rule_id: R28:corrective_action_closure
  nodes:
  - NodeRequirement
  - experiment
  check: 'Code: FAILED закрывается только новой попыткой/ревизией с evidence эффективности и решением; прежняя оценка хранится'
- rule_id: R29:report_completeness
  nodes:
  - report
  - conclusion
  check: 'Code: разделы из графа: покрытие, неопределённость, находки, limitations[], real/stub/human, решения HITL (кто, делегировано, timeout→agent)'
- rule_id: R30:information_access_integrity
  nodes:
  - artifact
  check: 'Code: блоб cas/<sha256> читается; paper без файла → download_failed, не пропадает'
- rule_id: ENG:registration_integrity
  nodes:
  - artifact
  - evidence
  check: 'Code: re-read digest совпадает; иначе зависимые использования блокируются'
