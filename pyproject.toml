[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coscientist"
version = "0.1.0"
description = "CoScientist-next: multi-agent research system (state-owned core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "rfc8785>=0.1.4",
  "defusedxml>=0.7.1",
]

[project.scripts]
coscientist = "coscientist.cli.run:main"

[project.optional-dependencies]
mcp = [
  "httpx>=0.27,<1",
]
api = [
  "fastapi>=0.115,<1",
]
dev = [
  "coscientist[api]",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["coscientist"]

[tool.hatch.build.targets.wheel.force-include]
"coscientist/schema/graph_schema.yaml" = "coscientist/schema/graph_schema.yaml"
"coscientist/schema/minimal_report.schema.json" = "coscientist/schema/minimal_report.schema.json"
"coscientist/schema/study_refused.schema.json" = "coscientist/schema/study_refused.schema.json"
"coscientist/profiles/packaged/tool_catalog.json" = "coscientist/profiles/packaged/tool_catalog.json"
"coscientist/profiles/packaged/production_catalog.json" = "coscientist/profiles/packaged/production_catalog.json"
"coscientist/profiles/packaged/research.v1.yaml" = "coscientist/profiles/packaged/research.v1.yaml"
"coscientist/profiles/packaged/research-glm.v1.yaml" = "coscientist/profiles/packaged/research-glm.v1.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running load or integration tests",
  "serial: must not run in parallel with other tests (timing-sensitive)",
  "perf: absolute latency SLO (separate CI job; not in main pytest)",
]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
files = ["coscientist", "bench", "web"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.importlinter]
root_packages = ["coscientist", "web", "bench"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "coscientist must not import bench"
type = "forbidden"
source_modules = ["coscientist"]
forbidden_modules = ["bench"]

[[tool.importlinter.contracts]]
name = "core must not import ADK, httpx, or web"
type = "forbidden"
source_modules = ["coscientist.core", "coscientist.checks", "coscientist.experimental"]
forbidden_modules = [
  "google",
  "httpx",
  "fastapi",
  "coscientist.api",
  "coscientist.tools",
  "coscientist.agents",
  "coscientist.llm",
  "coscientist.mcp",
  "coscientist.profiles",
  "coscientist.reporting",
  "web",
]
# experimental composes API StudyRuntime (lifecycle) — not a web/ADK edge.
ignore_imports = [
  "coscientist.experimental.runtime -> coscientist.api.runtime",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "core must not import experimental"
type = "forbidden"
source_modules = ["coscientist.core"]
forbidden_modules = ["coscientist.experimental"]

[[tool.importlinter.contracts]]
name = "reporting must not import api, agents, tools, llm, mcp, or web"
type = "forbidden"
source_modules = ["coscientist.reporting"]
forbidden_modules = [
  "coscientist.api",
  "coscientist.agents",
  "coscientist.tools",
  "coscientist.llm",
  "coscientist.mcp",
  "web",
]

[[tool.importlinter.contracts]]
name = "llm must not import core, tools, agents, api, checks, experimental, google, httpx"
type = "forbidden"
source_modules = ["coscientist.llm"]
forbidden_modules = [
  "coscientist.core",
  "coscientist.tools",
  "coscientist.agents",
  "coscientist.api",
  "coscientist.checks",
  "coscientist.experimental",
  "google",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "cli may use httpx for LLM transport only"
type = "forbidden"
source_modules = ["coscientist.cli"]
forbidden_modules = ["coscientist.mcp", "google"]
ignore_imports = [
  "coscientist.cli.http_transport -> httpx",
  # Concrete MCP ToolRouter (#139) used by LlmAgentAdapter / StaticToolRouter cassette.
  "coscientist.tools.router -> coscientist.mcp.*",
  "coscientist.tools.mcp_adapter -> coscientist.mcp.*",
  # Live CLI path: open_tool_router_for_cli (stdio / HttpxTransport) via mcp_live.
  "coscientist.tools.mcp_live -> coscientist.mcp.*",
  # CLI loads packaged Profile (Identifier / McpServers types only via profiles → mcp.config).
  "coscientist.profiles.models -> coscientist.mcp.config",
  "coscientist.profiles.catalog -> coscientist.mcp.config",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "mcp must not import coscientist.core, tools, agents, api, llm, checks, experimental"
type = "forbidden"
source_modules = ["coscientist.mcp"]
forbidden_modules = [
  "coscientist.core",
  "coscientist.tools",
  "coscientist.agents",
  "coscientist.api",
  "coscientist.llm",
  "coscientist.checks",
  "coscientist.experimental",
]

[[tool.importlinter.contracts]]
name = "agents, api, tools, llm must not import coscientist.mcp"
type = "forbidden"
source_modules = [
  "coscientist.agents",
  "coscientist.api",
  "coscientist.tools",
  "coscientist.llm",
]
forbidden_modules = ["coscientist.mcp"]
ignore_imports = [
  "coscientist.tools.mcp_adapter -> coscientist.mcp.*",
  "coscientist.tools.mcp_live -> coscientist.mcp.*",
  "coscientist.tools.router -> coscientist.mcp.*",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "httpx is only allowed in coscientist.mcp.httpx_transport"
type = "forbidden"
source_modules = [
  "coscientist.core",
  "coscientist.checks",
  "coscientist.experimental",
  "coscientist.llm",
  "coscientist.tools",
  "coscientist.agents",
  "coscientist.api",
  "coscientist.schema",
  "coscientist.mcp",
  "coscientist.profiles",
  "web",
]
forbidden_modules = ["httpx"]
ignore_imports = [
  "coscientist.mcp.httpx_transport -> httpx",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "agents layer above tools and llm"
type = "layers"
layers = [
  "coscientist.agents",
  "coscientist.tools | coscientist.llm",
]

[[tool.importlinter.contracts]]
name = "agents must not import api"
type = "forbidden"
source_modules = ["coscientist.agents"]
forbidden_modules = ["coscientist.api"]

[[tool.importlinter.contracts]]
name = "tools must not import api"
type = "forbidden"
source_modules = ["coscientist.tools"]
forbidden_modules = ["coscientist.api"]

[[tool.importlinter.contracts]]
name = "tools must not import agents or llm"
type = "forbidden"
source_modules = ["coscientist.tools"]
forbidden_modules = ["coscientist.agents", "coscientist.llm"]

[[tool.importlinter.contracts]]
name = "invoke_tool is the only tools entry (no direct contract/effects import)"
type = "forbidden"
source_modules = ["coscientist.api", "coscientist.checks", "coscientist.experimental"]
forbidden_modules = [
  "coscientist.tools.contract",
  "coscientist.tools.effects",
  "coscientist.tools.gate",
  "coscientist.tools.jobs",
  "coscientist.tools.coder",
  "coscientist.tools.coder.run",
  "coscientist.tools.coder.attach",
  "coscientist.tools.taint",
]

[[tool.importlinter.contracts]]
name = "agents must use invoke_tool (no contract / registry / gate)"
type = "forbidden"
source_modules = ["coscientist.agents"]
# tools.contract forbidden for agents (no Tool / star / CallCtx). Adapter takes
# CallCtx from core.execution.call_ctx — no agents.* → tools.contract edge.
# ignore_imports below cover only the transitive agents→router/mcp→contract
# chain (ToolOutput / ToolSpec). No allow_indirect_imports. AST bans Tool/star.
forbidden_modules = [
  "coscientist.tools.contract",
  "coscientist.tools.gate",
  "coscientist.tools.jobs",
  "coscientist.tools.coder",
  "coscientist.tools.coder.run",
  "coscientist.tools.coder.attach",
  "coscientist.tools.taint",
  "coscientist.core.execution.tool_registry",
]
ignore_imports = [
  "coscientist.tools.router -> coscientist.tools.contract",
  "coscientist.tools.mcp_adapter -> coscientist.tools.contract",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "agents must not import dispose or artifact_stamp"
type = "forbidden"
source_modules = ["coscientist.agents"]
forbidden_modules = [
  "coscientist.core.claims.dispose",
  "coscientist.core.execution.artifact_stamp",
]

[[tool.importlinter.contracts]]
name = "SourceFetched only via invoke_tool (no source_fetch import)"
type = "forbidden"
# Direct imports only: checks may reach artifacts→verify; experimental may
# reach executor→load index. Agents/checks/experimental must not import
# source_fetch themselves (capability mint stays in invoke_tool).
allow_indirect_imports = true
source_modules = [
  "coscientist.agents",
  "coscientist.checks",
  "coscientist.experimental",
]
forbidden_modules = ["coscientist.core.execution.source_fetch"]

